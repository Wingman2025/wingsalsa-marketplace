services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wingsalsa_marketplace
      POSTGRES_USER: wingsalsa
      POSTGRES_PASSWORD: wingsalsa_local
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingsalsa -d wingsalsa_marketplace"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - wingsalsa_postgres:/var/lib/postgresql/data

volumes:
  wingsalsa_postgres:

